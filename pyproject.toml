[project]
name = "Estructuras"
version = "0.1.0"
description = "Estructuras de datos para python"
authors = [
    { name = "RzPro" }
]
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]